<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NetsingTool</title>
<base href="{{ root_path }}/">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header>
  <h1>NetsingTool - 断熱材部品平面化・ネスティング</h1>
  <div>
    <span id="username-label"></span>
    <button id="logout-btn">ログアウト</button>
  </div>
</header>

<main>
  <section class="panel" id="settings-panel">
    <h2>部品・パラメータ設定</h2>
    <label>STEP ファイル (複数選択可)
      <input type="file" id="file-input" accept=".step,.stp" multiple>
    </label>
    <div class="shape-actions">
      <button type="button" id="add-rectangle-btn">+ 矩形を追加</button>
      <button type="button" id="add-circle-btn">+ 円形を追加</button>
    </div>
    <table id="parts-table">
      <thead><tr><th>種別</th><th>名称・寸法</th><th>数量</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="hint">※数量に 0 または負の数を入力すると、定尺から最大何個切り出せるか自動計算します。</p>

    <div class="param-grid">
      <label>定尺幅 (mm)<input type="number" id="sheet_w" value="1000" min="1" max="100000" step="0.1"></label>
      <label>定尺高さ (mm)<input type="number" id="sheet_h" value="2000" min="1" max="100000" step="0.1"></label>
      <label>材料厚み (mm)<input type="number" id="thickness" value="10" min="0.1" max="1000" step="0.1"></label>
      <label>クリアランス (mm)<input type="number" id="clearance" value="5" min="0" max="1000" step="0.1"></label>
      <label>密度 (g/cm³)<input type="number" id="density" value="1.0" min="0.001" max="50" step="0.001"></label>
    </div>

    <button id="run-btn">実行</button>
    <p id="status-text"></p>
    <p id="error-text" class="error"></p>
  </section>

  <section class="panel" id="results-panel" hidden>
    <h2>結果</h2>
    <div id="candidate-tabs"></div>
    <img id="nesting-image" alt="ネスティング配置図">
    <p id="weight-summary"></p>
    <table id="breakdown-table">
      <thead><tr><th>部品名</th><th>数量指定</th><th>配置数</th><th>横(mm)</th><th>縦(mm)</th><th>部品面積(mm²)</th><th>展開面積(mm²)</th><th>重量(kg)</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="downloads">
      <button id="download-zip-btn">全成果物を ZIP でダウンロード</button>
    </div>
  </section>
</main>

<script src="static/app.js"></script>
</body>
</html>
